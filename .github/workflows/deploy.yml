# 构建并部署 Astro 站点到 GitHub Pages (an0313.github.io)
# 前置: 仓库 Settings -> Pages -> Source 必须设为 "GitHub Actions"
name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
# 避免并发部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: ./
      - name: Clear old artifact (避免 re-run 冲突)
        uses: actions/delete-artifact@v5
        with:
          name: github-pages
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
